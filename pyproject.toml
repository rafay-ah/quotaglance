[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "quotaglance"
version = "0.1.0"
description = "Your AI coding quotas at a glance: a native GNOME app for Claude Code, Codex, Cursor, Copilot and more."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "rafay-ah" }]
keywords = ["gnome", "gtk4", "libadwaita", "claude", "codex", "cursor", "copilot", "quota", "usage"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: GTK",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Desktop Environment :: Gnome",
    "Topic :: Utilities",
]
# PyGObject, GTK 4, libadwaita and libsecret come from the system
# (python3-gi, gir1.2-gtk-4.0, gir1.2-adw-1, gir1.2-secret-1).
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.5"]

[project.urls]
Homepage = "https://github.com/rafay-ah/quotaglance"
Issues = "https://github.com/rafay-ah/quotaglance/issues"

[project.scripts]
quotaglance = "quotaglance.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
quotaglance = ["gui/*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "RUF012", "SIM105"]

[tool.ruff.lint.isort]
known-first-party = ["quotaglance"]
